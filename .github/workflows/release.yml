name: Release CLI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify CLI
        run: |
          go test ./cmd/nexa/...
          go vet ./cmd/nexa/...

      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "发布标签必须是 vX.Y.Z 格式的稳定版本：$tag" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "hash=$(git rev-parse --short=12 HEAD)"
            echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%S+00:00')"
          } >>"$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          VERSION: '${{ steps.metadata.outputs.version }}'
          HASH: '${{ steps.metadata.outputs.hash }}'
          BUILD_TIME: '${{ steps.metadata.outputs.build_time }}'
        run: make all

      - name: Create checksums
        working-directory: bin
        run: |
          file nexa-linux-amd64 nexa-linux-arm64
          if readelf -l nexa-linux-amd64 nexa-linux-arm64 | grep INTERP >/dev/null; then
            echo 'Linux 产物包含动态加载器，不能发布。' >&2
            exit 1
          fi
          sha256sum nexa-* > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        shell: bash
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$state" != true ]]; then
              echo "版本 $TAG 已发布，不能覆盖现有产物，请使用新版本号。" >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "$TAG"
          fi
          gh release upload "$TAG" bin/* --clobber
          gh release edit "$TAG" --draft=false
