name: Verify code

on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  cli:
    name: Verify public CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run CLI tests
        run: go test -race ./cmd/nexa/...

      - name: Check CLI code
        run: go vet ./cmd/nexa/...
