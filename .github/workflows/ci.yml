name: Verify code

on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  public:
    name: Verify public packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # kit/authz 依赖私有 RBAC 模块，公开环境无法编译
      - name: List public packages
        id: packages
        run: echo "list=$(go list -e ./... | grep -v '/kit/authz' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test -race ${{ steps.packages.outputs.list }}

      - name: Check code
        run: go vet ${{ steps.packages.outputs.list }}
