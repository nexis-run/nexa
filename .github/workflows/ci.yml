name: Verify code

on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  cli:
    name: Verify public CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run CLI tests
        run: go test -race ./cmd/nexa/...

      - name: Check CLI code
        run: go vet ./cmd/nexa/...

      - name: Report verification scope
        if: always()
        env:
          EVENT_NAME: '${{ github.event_name }}'
          REF_NAME: '${{ github.ref }}'
        run: |
          echo '本任务仅检查公开 CLI 包。' >>"$GITHUB_STEP_SUMMARY"
          if [[ "$EVENT_NAME" == 'pull_request' || "$REF_NAME" != 'refs/heads/master' ]]; then
            echo '私有框架全包检查未运行，仅在可信 master 分支的推送或手动任务中执行。' >>"$GITHUB_STEP_SUMMARY"
          else
            echo '私有框架全包检查结果见 Verify private framework 任务。' >>"$GITHUB_STEP_SUMMARY"
          fi

  framework:
    name: Verify private framework
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: 'gopkg.auroraride.com'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Download private dependencies
        env:
          NEXA_GITLAB_USERNAME: '${{ vars.NEXA_GITLAB_USERNAME }}'
          NEXA_GITLAB_READ_TOKEN: '${{ secrets.NEXA_GITLAB_READ_TOKEN }}'
        shell: bash
        run: |
          if [[ -z "$NEXA_GITLAB_USERNAME" || -z "$NEXA_GITLAB_READ_TOKEN" ]]; then
            echo '::error::请配置仓库变量 NEXA_GITLAB_USERNAME 和仓库密钥 NEXA_GITLAB_READ_TOKEN，使用可读取私有 RBAC 仓库的只读部署令牌；全包检查尚未执行。'
            exit 1
          fi

          # shellcheck disable=SC2016
          helper='!f() {
            [ "$1" = get ] || exit 0
            protocol= host=
            while IFS="=" read -r key value; do
              [ -n "$key" ] || break
              case "$key" in
                protocol) protocol=$value ;;
                host) host=$value ;;
              esac
            done
            if [ "$protocol" = https ] && [ "$host" = gitlab.liasica.com ]; then
              printf "username=%s\npassword=%s\n" "$NEXA_GITLAB_USERNAME" "$NEXA_GITLAB_READ_TOKEN"
            fi
          }; f'
          GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0='' \
            GIT_CONFIG_KEY_1=credential.helper GIT_CONFIG_VALUE_1="$helper" \
            go mod download

      - name: Verify module files
        run: go mod tidy -diff

      - name: Run framework tests
        run: go test -race ./...

      - name: Check framework code
        run: go vet ./...
